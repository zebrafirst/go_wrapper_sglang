# version v2.5.0
[svcName] #服务配置;section与服务名匹配;
finder = 0
#port = 5090    #缺省：随机端口

[aiges] #统一引擎相关通用配置;
gesMock = false
sessMode = true
numaNode = 0
realTimeRlt = false
usrCfg = ""
sub = "common"

catchOn=false #是否开启卡死检测和崩溃堆栈抓取 默认为true
httpRetry=1 #是否开启个性化资源下载重试，默认为1
wrapperDelayDetectPeriod=60 #检测卡死的周期 默认为60s

[uds] # universal diagnostic service
able = false # 捕获异常信号和事件总开关，true: 开启异常捕获；false: 关闭异常捕获；default: true
eventCrashOn = false # 崩溃事件开关. 类型：bool， 默认：true
eventTimeoutOn = false # wrapper接口超时事件开关. 类型：bool， 默认：false
dumpHandler = 0 # 事件捕获工具类型， 类型：int 默认：0， 可选值：0：minidump 1：gdb
wrapperCallDelay = 60 # 插件接口超时限制, 当超时后会上报超时事件, 并使用minidump获取堆栈 类型：int, 单位秒 默认：60s

[auth]
meterCtrl = false
meterWrapperCtrl = false
janusCtrl=false     #是否开启并发上报 此字段存在时 默认true,不传字段时为false
janusRpMs=400          #并发上报周期，默认为400ms

[wrapper] #wrapper示例配置
"common.lic" = "10"
"resource.bin" = "HMM_16K"

[resource]
able = false #是否开启个性化

#以下配置在启用个性化时才生效
memory=30 #默认加载器个性化资源缓存大小最大值 默认30G
capacity=50000 #默认加载器个性化资源缓存个数 默认50000
host=""# ats下载个性化资源地址
index="" #个性化系统v1版本 通过tag查询资源的服务地址
indexV2="" #个性化系统v2版本 通过res_id查询资源的服务地址
channel=4 #个性化下载通道：1:ats, 2:hbase, 4:all
tags="t1,t2,t3" #个性化系统v1查询tag,请求参数中符合tag的将会一并放到个性化索引请求的business param中

[elog]
elogRemote = false
elogLocal = false
elogConsumer = 2
elogHost = "127.0.0.1"
elogPort = "4545"
elogXml = "seelog.xml"
elogSpill = "/log/server/iatspill"
elogS3ak = ""
elogS3sk = ""
elogS3ep = ""
elogZkhost = ""

[log]
level = "debug"
file = "./log/aiges.log"
size = 3
count = 3
die = 3
async = 0

[lbv2]
lbname = "lb-niche"    #传给服务发现，用来确定使用哪个lb       程序启动时候-m=1表示使用服务发现来寻找Lb
able = 0
sub = "sub"
subsvc = "svc"
apiversion = "1.0.0"
conn-timeout = 100
conn-pool-size = 20        #rpc连接池数量。缺省4
lb-mode= 0  #0禁用lb,2使用lb。缺省0      ats只是上报lb,不使用lb，所以设为0
lb-retry = 2
taddrs="lbv2@10.1.87.68:9095"    #不使用服务发现时候使用的默认lb地址

[fc]    #xrpc flowControl
able = 1
router = "sessionManager"   #路由字段，可选项为sessionManager和qpsLimiter
max = 10                   #会话模式时代表最大的授权量，非会话模式代表间隔时间里的最大请求数
ttl = 10000                  #会话模式代表会话的超时时间，非会话模式代表有效期（间隔时间）
best = 10                   #最佳授权数
roll = 5000
strategy = 2                 #可选值为0、1、2（缺省为0），0.代表定时上报(v1)；1.根据授权范围上报(v1)；2.基于hermes(v2)

[trace]
host = "127.0.0.1"
port = 4545
able = 0
deliver = 1 #缺省1
dump = 0
backend = 2
buffer=2000
bcluster = "5s"
idc = "dz"
loadts = 1000000

[pprof]
able=false  #是否开启引擎pprof 默认为false
host="127.0.0.1"
port="8089" #pprof server端口 默认为1234
